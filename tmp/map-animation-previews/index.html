<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>0161 map animation previews</title><link rel="stylesheet" href="/vendor/leaflet/leaflet.css"><style>
*{box-sizing:border-box}body{margin:0;background:#111211;color:#faecd2;font:14px Arial,sans-serif}main{max-width:1200px;margin:auto;padding:28px 24px}h1{font-size:28px;color:#dffc3a;margin:0 0 12px}p{color:#a5aaa2;line-height:1.5}nav{display:flex;gap:8px;margin:20px 0}button{background:#111211;color:#a5aaa2;border:1px solid #454945;min-height:44px;padding:10px 20px;font:700 13px Arial;cursor:pointer}button[aria-pressed=true]{color:#dffc3a;border-color:#dffc3a}button:focus-visible{outline:2px solid #dffc3a;outline-offset:3px}.stage{position:relative;height:min(68vh,660px);min-height:360px;overflow:hidden;border:1px solid #454945}#map{height:100%;width:100%;background:#444}.leaflet-tile-pane{filter:grayscale(1) brightness(.8)}.grid{position:absolute;inset:0;z-index:450;pointer-events:none;background-image:linear-gradient(to right,#ffffff25 1px,transparent 1px),linear-gradient(to bottom,#ffffff25 1px,transparent 1px);background-size:64px 64px}.athletes{position:absolute;inset:0;z-index:460;pointer-events:none;color:#dffc3a}.athlete{position:absolute;left:0;width:64px;height:64px;animation:travel 3s linear infinite}.athlete:nth-child(1){top:20%;--delay:0s;animation-delay:var(--delay)}.athlete:nth-child(2){top:48%;animation-delay:-1s}.athlete:nth-child(3){top:73%;animation-delay:-2s}.athlete svg{width:64px;height:64px;overflow:visible;filter:drop-shadow(0 0 4px #dffc3a66)}.athlete .limb-a{transform-box:fill-box;transform-origin:top;animation:stride .75s ease-in-out infinite alternate}.athlete .limb-b{transform-box:fill-box;transform-origin:top;animation:stride .75s ease-in-out infinite alternate-reverse}.athlete .wheel{transform-box:fill-box;transform-origin:center;animation:wheel .75s linear infinite}.athlete .swim-arm{transform-box:fill-box;transform-origin:right;animation:swim .75s ease-in-out infinite alternate}.cycling,.swimming{display:none}.stage[data-sport=cycling] .running,.stage[data-sport=swimming] .running{display:none}.stage[data-sport=cycling] .cycling,.stage[data-sport=swimming] .swimming{display:block}.label{position:absolute;right:16px;top:16px;z-index:470;padding:10px;background:#111211e8;color:#dffc3a;font-size:11px;letter-spacing:.12em;pointer-events:none}.note{font-size:12px}.leaflet-control-attribution{font-size:10px!important}.leaflet-control-attribution a{color:#333}@keyframes travel{0%{left:5%;opacity:0}7%{opacity:1}93%{opacity:1}100%{left:87%;opacity:0}}@keyframes stride{from{transform:rotate(-28deg)}to{transform:rotate(28deg)}}@keyframes wheel{to{transform:rotate(360deg)}}@keyframes swim{from{transform:rotate(-20deg)}to{transform:rotate(35deg)}}
@media(max-width:640px){main{padding:20px 0}h1,p,nav{margin-left:18px;margin-right:18px}.stage{border-left:0;border-right:0;height:60vh}.grid{background-size:48px 48px}.athlete,.athlete svg{width:48px;height:48px}button{flex:1;padding:8px}nav{gap:5px}}
@media(prefers-reduced-motion:reduce){.athlete,.athlete *{animation:none!important}.athlete:nth-child(1){left:20%}.athlete:nth-child(2){left:45%}.athlete:nth-child(3){left:70%}}
</style></head><body><main><h1>THE 0161 MAP</h1><p>Three animation studies. Greyscale roads and place names, a large square grid, and neon green figures.</p><nav aria-label="Choose animation preview"><button data-sport="running" aria-pressed="true">RUNNING</button><button data-sport="cycling" aria-pressed="false">CYCLING</button><button data-sport="swimming" aria-pressed="false">SWIMMING</button></nav><div class="stage" data-sport="running"><div id="map" aria-label="Greyscale Greater Manchester map"></div><div class="grid" aria-hidden="true"></div><div class="athletes" aria-hidden="true"></div><div class="label">RUNNING / 3 SECOND LOOP</div></div><p class="note">Illustrative movement, not routes or live sessions. Preview only; the homepage has not changed.</p></main>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>

<symbol id="swimming" viewBox="0 0 64 64"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><circle cx="48" cy="28" r="4" fill="currentColor"/><path d="m41 33-21 4-11-3"/><g class="swim-arm"><path d="m37 33-9-15 15-4"/></g><path class="limb-a" d="m21 37-14 6"/><path stroke-width="1.5" d="m3 49 7-3 7 3 7-3 7 3 7-3 7 3 7-3 9 3m-54 7 7-3 7 3 7-3 7 3 7-3 7 3 7-3"/></g></symbol>
</defs></svg><script src="/vendor/leaflet/leaflet.js"></script><script>
/* Only one tile map is needed for all three previews; animations use SVG and CSS. */
const map=L.map('map',{scrollWheelZoom:false,zoomAnimation:false,fadeAnimation:false,attributionControl:true}).setView([53.48,-2.25],11);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,detectRetina:false,updateWhenIdle:true,keepBuffer:1,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors | Contains OS data © Crown copyright and database right'}).addTo(map);
const athletes=document.querySelector('.athletes');
for(let i=0;i<3;i++){const a=document.createElement('div');a.className='athlete';a.innerHTML=['running','cycling','swimming'].map(s=>`<svg class="${s}"><use href="#${s}"/></svg>`).join('');athletes.append(a)}
document.querySelectorAll('button[data-sport]').forEach(button=>button.addEventListener('click',()=>{document.querySelector('.stage').dataset.sport=button.dataset.sport;document.querySelector('.label').textContent=button.textContent+' / 3 SECOND LOOP';document.querySelectorAll('button[data-sport]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)))}));
</script></body></html>
